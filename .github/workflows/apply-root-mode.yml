name: Apply root setup mode patch

on:
  push:
    branches: [feature/root-setup-mode]
    paths: [.github/workflows/apply-root-mode.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/root-setup-mode
      - name: Apply root mode source changes
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, got {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          def sub_once(path, pattern, replacement):
              p = Path(path)
              text = p.read_text()
              new, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"Expected one regex match in {path}, got {count}: {pattern[:100]!r}")
              p.write_text(new)

          # Persist the chosen privilege path. Existing installs default to the non-root behavior.
          replace_once(
              "app/src/main/java/com/abdulkus/essentialremap/ui/UserPreferences.kt",
              "import com.abdulkus.essentialremap.ScreenOffKeyAccess\n",
              "import com.abdulkus.essentialremap.ScreenOffKeyAccess\nimport com.abdulkus.essentialremap.setup.SetupAccessMode\n",
          )
          replace_once(
              "app/src/main/java/com/abdulkus/essentialremap/ui/UserPreferences.kt",
              '''    var onboardingComplete: Boolean
        get() = preferences.getBoolean(KEY_ONBOARDING_COMPLETE, false)
        set(value) {
            preferences.edit().putBoolean(KEY_ONBOARDING_COMPLETE, value).apply()
        }

    var screenOffEnabled: Boolean''',
