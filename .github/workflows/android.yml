name: Android build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 0.1.26

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.SIGNING_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || secrets.SIGNING_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.SIGNING_KEY_ALIAS || secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing key
        shell: bash
        run: |
          if [[ -n "$RELEASE_KEYSTORE_BASE64" && \
                -n "$SIGNING_STORE_PASSWORD" && \
                -n "$SIGNING_KEY_ALIAS" && \
                -n "$SIGNING_KEY_PASSWORD" ]]; then
            signing_file="$RUNNER_TEMP/essential-remap-release.keystore"
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$signing_file"
            chmod 600 "$signing_file"
            if keytool -list \
                -keystore "$signing_file" \
                -storetype PKCS12 \
                -storepass "$SIGNING_STORE_PASSWORD" \
                -alias "$SIGNING_KEY_ALIAS" > /dev/null 2>&1; then
              echo "SIGNING_STORE_TYPE=PKCS12" >> "$GITHUB_ENV"
            elif keytool -list \
                -keystore "$signing_file" \
                -storetype JKS \
                -storepass "$SIGNING_STORE_PASSWORD" \
                -alias "$SIGNING_KEY_ALIAS" > /dev/null 2>&1; then
              echo "SIGNING_STORE_TYPE=JKS" >> "$GITHUB_ENV"
            else
              echo "::error::The release keystore, password or alias is invalid."
              exit 1
            fi
            echo "SIGNING_STORE_FILE=$signing_file" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "Signing secrets are unavailable for this pull request; using the repository test key."
          else
            echo "::error::Release signing secrets are incomplete. Add RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD."
            exit 1
          fi

      - name: Test, lint and build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Verify release APK signature
        run: |
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Prepare APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "essential-remap-${APP_VERSION}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "essential-remap-${APP_VERSION}.apk"
          sha256sum "essential-remap-${APP_VERSION}.apk" > "essential-remap-${APP_VERSION}.apk.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: essential-remap-${{ env.APP_VERSION }}
          path: |
            essential-remap-${{ env.APP_VERSION }}.apk
            essential-remap-${{ env.APP_VERSION }}.apk.sha256
            essential-remap-${{ env.APP_VERSION }}-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Check whether release already exists
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: release_check
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${APP_VERSION}" >/dev/null 2>&1; then
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: steps.release_check.outputs.create == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Essential Remap v${{ env.APP_VERSION }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            essential-remap-${{ env.APP_VERSION }}.apk
            essential-remap-${{ env.APP_VERSION }}.apk.sha256
