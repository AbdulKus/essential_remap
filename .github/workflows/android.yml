name: Android build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 0.1.5

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Test, lint and build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Prepare APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "essential-remap-${APP_VERSION}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "essential-remap-${APP_VERSION}.apk"
          sha256sum "essential-remap-${APP_VERSION}.apk" > "essential-remap-${APP_VERSION}.apk.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: essential-remap-${{ env.APP_VERSION }}
          path: |
            essential-remap-${{ env.APP_VERSION }}.apk
            essential-remap-${{ env.APP_VERSION }}.apk.sha256
            essential-remap-${{ env.APP_VERSION }}-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Check whether release already exists
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: release_check
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${APP_VERSION}" >/dev/null 2>&1; then
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: steps.release_check.outputs.create == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Essential Remap v${{ env.APP_VERSION }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            essential-remap-${{ env.APP_VERSION }}.apk
            essential-remap-${{ env.APP_VERSION }}.apk.sha256
