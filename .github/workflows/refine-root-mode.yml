name: Refine root mode transitions

on:
  push:
    branches: [feature/root-setup-mode]
    paths:
      - .github/scripts/refine_root_mode.py
      - .github/workflows/refine-root-mode.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/root-setup-mode
      - name: Apply refinements
        run: python .github/scripts/refine_root_mode.py
      - name: Commit refinements
        run: |
          git config user.name "free_vibrancy"
          git config user.email "73951988+AbdulKus@users.noreply.github.com"
          git add -A
          git commit -m "Handle root monitor mode transitions"
          git push origin HEAD:feature/root-setup-mode
