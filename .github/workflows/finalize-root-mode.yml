name: Finalize root mode

on:
  push:
    branches:
      - feature/root-setup-mode
    paths:
      - tools/finalize_root_mode.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/root-setup-mode
      - name: Apply final root mode fixes
        run: python3 tools/finalize_root_mode.py
      - name: Commit final fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize root monitor mode tracking"
          git push origin HEAD:feature/root-setup-mode
