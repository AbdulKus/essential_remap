name: Apply v0.1.24 patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-v024.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/apply_v024.py

      - name: Keep release workflow unchanged for this bot commit
        run: git checkout -- .github/workflows/android.yml

      - name: Remove one-shot files
        run: rm .github/scripts/apply_v024.py .github/workflows/apply-v024.yml

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No patch changes produced"; exit 1; }
          git commit -m "Fix setup status, ADB reconnect and sound permission"
          git push origin HEAD:main
