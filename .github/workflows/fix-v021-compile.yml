name: Fix Essential Remap v0.1.21 compile

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-v021-compile.yml
      - .github/scripts/fix_v021_compile.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply compile fixes
        run: python3 .github/scripts/fix_v021_compile.py
      - name: Guard monitor revision
        run: grep -F 'const val REVISION = 8' app/src/main/java/com/abdulkus/essentialremap/setup/ShellKeyMonitorCommands.kt
      - name: Commit source fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          git commit -m 'Fix v0.1.21 setup compilation and reconnect fallback'
          git push origin HEAD:main
