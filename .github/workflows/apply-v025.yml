name: Apply v0.1.25 patch

on:
  push:
    paths:
      - '.github/workflows/apply-v025.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/apply_v025.py
      - name: Remove one-shot files
        run: rm -f .github/scripts/apply_v025.py .github/workflows/apply-v025.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace IN with Hindi and preview haptics"
          git push
