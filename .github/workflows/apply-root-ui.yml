name: Apply root setup UI

on:
  push:
    branches: [feature/root-setup-mode]
    paths:
      - .github/scripts/apply_root_ui.py
      - .github/workflows/apply-root-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/root-setup-mode
      - name: Apply UI changes
        run: python .github/scripts/apply_root_ui.py
      - name: Commit UI
        run: |
          git config user.name "free_vibrancy"
          git config user.email "73951988+AbdulKus@users.noreply.github.com"
          git add -A
          git commit -m "Add root and non-root setup UI"
          git push origin HEAD:feature/root-setup-mode
