name: Apply v0.1.26 patch

on:
  push:
    paths:
      - '.github/workflows/apply-v026.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch
        run: python .github/patch-v026.py
      - name: Keep release and workflow metadata unchanged
        run: git checkout -- app/build.gradle.kts .github/workflows/android.yml .github/patch-v026.py .github/workflows/apply-v026.yml
      - name: Commit and push source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+AbdulKus@users.noreply.github.com"
          git add app/src/main/java/com/abdulkus/essentialremap/ui/MapperScreen.kt app/src/main/java/com/abdulkus/essentialremap/ui/MapperViewModel.kt app/src/main/java/com/abdulkus/essentialremap/haptics/HapticEngine.kt
          git commit -m "Fix first-run theme and haptic preview"
          git push
