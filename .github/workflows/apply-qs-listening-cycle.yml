name: Apply Quick Settings listening cycle patch

on:
  push:
    branches:
      - fix/qs-tile-listening-cycle
    paths:
      - .github/workflows/apply-qs-listening-cycle.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/qs-tile-listening-cycle
      - name: Apply source patch
        run: python tools/apply_qs_listening_patch.py
      - name: Commit patched source
        run: |
          git config user.name "free_vibrancy"
          git config user.email "73951988+AbdulKus@users.noreply.github.com"
          git add -A
          git commit -m "Prepare Quick Settings before tile clicks"
          git push origin HEAD:fix/qs-tile-listening-cycle
