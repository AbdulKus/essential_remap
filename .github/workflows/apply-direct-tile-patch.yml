name: Apply direct Quick Settings tile patch

on:
  push:
    branches: [fix/direct-qs-tile-monitor]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source patch
        run: python .github/scripts/apply_direct_tile_patch.py
      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "free_vibrancy"
          git config user.email "73951988+AbdulKus@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Use shell monitor for Quick Settings tiles"
          git push origin HEAD:fix/direct-qs-tile-monitor
