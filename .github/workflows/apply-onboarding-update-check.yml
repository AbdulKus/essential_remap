name: Apply onboarding update check

on:
  push:
    branches: [automation/onboarding-update-check]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reset target files to main
        shell: bash
        run: |
          cp .github/scripts/apply_onboarding_update.py /tmp/apply_onboarding_update.py
          git fetch origin main
          git reset --hard origin/main

      - name: Patch onboarding update flow
        shell: bash
        run: |
          python3 /tmp/apply_onboarding_update.py
          git checkout origin/main -- .github/workflows/android.yml

      - name: Verify changes
        shell: bash
        run: |
          grep -q 'private fun UpdateCheckStep' app/src/main/java/com/abdulkus/essentialremap/ui/MapperScreen.kt
          grep -q 'updateState = updateState' app/src/main/java/com/abdulkus/essentialremap/MainActivity.kt
          grep -q 'versionCode = 30' app/build.gradle.kts
          grep -q 'versionName = "0.1.30"' app/build.gradle.kts
          git diff --check
          git diff -- app/src/main/java/com/abdulkus/essentialremap/ui/MapperScreen.kt app/src/main/java/com/abdulkus/essentialremap/MainActivity.kt app/build.gradle.kts

      - name: Commit to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/abdulkus/essentialremap/ui/MapperScreen.kt \
                  app/src/main/java/com/abdulkus/essentialremap/MainActivity.kt \
                  app/build.gradle.kts
          git commit -m 'Add update check to onboarding and bump app to 0.1.30'
          git push origin HEAD:main
