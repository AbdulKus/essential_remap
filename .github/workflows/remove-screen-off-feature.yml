name: Remove obsolete screen-off-after-action feature

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-screen-off-feature.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove feature and bump release
        run: python3 .github/scripts/remove_screen_off_feature.py

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove screen-off-after-action feature and release 0.1.20"
          git push
